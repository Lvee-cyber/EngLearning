<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#344a42" />
    <title>EngLearning</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./review.css?v=20260715-desk" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./site-config.js?v=20260715-desk"></script>
    <script src="./content-store.js?v=20260715-desk"></script>
  </head>
  <body>
    <main class="page landing-page">
      <section class="landing-hero">
        <div class="landing-masthead">
          <a class="landing-brand" href="./index.html">EngLearning</a>
          <nav class="landing-mini-nav" aria-label="主要导航">
            <a href="./words.html">词库</a>
            <a href="./dictionary.html">辞典</a>
          </nav>
        </div>

        <div class="landing-hero-grid">
          <div class="landing-hero-copy">
            <p class="eyebrow">Today’s study desk</p>
            <h1 class="landing-title">今天，记住一点就好。</h1>
            <p id="landing-study-note" class="intro landing-intro">正在准备今天的学习计划。</p>
            <div class="landing-hero-actions">
              <a class="primary-button link-button" href="./review.html">开始今日复习</a>
              <a class="landing-text-link" href="./words.html">看看我的词库 <span aria-hidden="true">→</span></a>
            </div>
          </div>

          <div class="landing-today" aria-label="今日学习概览">
            <div id="landing-progress-ring" class="landing-progress-ring" style="--progress: 0%">
              <strong id="landing-due-count">—</strong>
              <span>待复习</span>
            </div>
            <dl class="landing-today-metrics">
              <div><dt>已掌握</dt><dd id="landing-mastered-count">—</dd></div>
              <div><dt>今日完成</dt><dd id="landing-today-count">—</dd></div>
              <div><dt>连续学习</dt><dd><span id="landing-streak-count">—</span> 天</dd></div>
            </dl>
          </div>
        </div>

        <div class="calendar-card calendar-inline landing-calendar" aria-label="今日日期">
          <span class="calendar-kicker">Today</span>
          <strong id="calendar-day" class="calendar-day"></strong>
          <span id="calendar-month" class="calendar-month"></span>
          <span id="calendar-date-text" class="calendar-date-text"></span>
          <span id="calendar-time-text" class="calendar-time-text"></span>
          <span id="calendar-lunar-text" class="calendar-lunar-text"></span>
          <span id="calendar-weekday" class="calendar-weekday"></span>
        </div>
      </section>

      <section class="panel landing-query-panel">
        <div class="landing-section-head">
          <div>
            <p class="section-kicker">Quick Lookup</p>
            <h2 class="landing-section-title">快速查单词</h2>
          </div>
          <a class="secondary-button link-button" href="./dictionary.html">打开完整辞典</a>
        </div>

        <div class="landing-query-row">
          <div class="setup-field landing-query-field">
            <label class="label" for="landing-dictionary-search">输入英文单词</label>
            <div class="landing-search-wrap">
              <input
                id="landing-dictionary-search"
                class="control text-control"
                type="search"
                placeholder="例如 streamline"
                autocomplete="off"
                spellcheck="false"
              />
              <div id="landing-dictionary-suggestions" class="dictionary-suggestions landing-suggestions hidden" role="listbox" aria-label="主页查词联想"></div>
            </div>
          </div>
          <button id="landing-dictionary-submit" class="primary-button" type="button">查询</button>
        </div>

        <div id="landing-query-result" class="landing-query-result" aria-live="polite">
          <p class="status-text">输入单词后即可联想匹配候选词。</p>
        </div>
      </section>

      <section class="panel landing-status-panel">
        <div class="landing-status-grid">
          <div class="landing-status-card">
            <span class="landing-status-label">内容来源</span>
            <p id="landing-content-status" class="landing-status-text" aria-live="polite">正在读取词库与辞典。</p>
          </div>
          <div class="landing-status-card">
            <span class="landing-status-label">同步状态</span>
            <p id="landing-progress-status" class="landing-status-text" aria-live="polite">正在检测在线进度服务。</p>
          </div>
        </div>
      </section>
    </main>

    <script src="./index.js?v=20260715-desk" defer></script>
  </body>
</html>
