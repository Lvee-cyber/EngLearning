<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#344a42" />
    <title>词库查看</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./review.css?v=20260820-users" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./site-config.js?v=20260715-profiles"></script>
    <script src="./content-store.js?v=20260715-profiles"></script>
    <script src="./auth.js?v=20260820-users"></script>
  </head>
  <body>
    <main class="page">
      <section class="panel words-hero">
        <div class="words-hero-row">
          <div>
            <p class="eyebrow">Vocabulary Library</p>
            <h1 class="words-title">查看词库</h1>
            <p class="intro">这里仅显示当前登录用户的生词与复习状态。</p>
          </div>
          <div class="words-nav">
            <a class="secondary-button link-button" href="./index.html">返回主页</a>
            <a class="secondary-button link-button" href="./dictionary.html">查辞典</a>
            <a class="secondary-button link-button" href="./review.html">返回复习</a>
            <a class="secondary-button link-button" href="./account.html">个人中心</a>
          </div>
        </div>
      </section>

      <section class="panel words-controls">
        <form class="words-toolbar" autocomplete="off">
          <div class="setup-field">
            <label class="label" for="words-profile-id">当前用户</label>
            <div id="words-profile-picker" class="profile-picker is-locked">
              <input
                id="words-profile-id"
                class="control text-control profile-picker-input"
                type="text"
                placeholder="当前登录用户"
                autocomplete="off"
                readonly
              />
              <button
                id="words-profile-picker-toggle"
                class="profile-picker-toggle"
                type="button"
                aria-label="用户由登录账号确定"
                hidden
                aria-expanded="false"
                aria-controls="words-profile-picker-panel"
              ></button>
              <div id="words-profile-picker-panel" class="profile-picker-panel hidden" role="listbox" aria-label="当前用户"></div>
            </div>
          </div>
          <div class="setup-field">
            <label class="label" for="words-filter">筛选状态</label>
            <select id="words-filter" class="control">
              <option value="all">全部词条</option>
              <option value="reviewable">待复习</option>
              <option value="mastered">熟词</option>
              <option value="hard">高错词</option>
            </select>
          </div>
          <div class="setup-field words-search">
            <label class="label" for="words-search">搜索</label>
            <div class="words-search-wrap">
              <input id="words-search" class="control text-control" type="search" placeholder="搜索单词、释义或解析" autocomplete="off" />
              <div id="words-search-suggestions" class="dictionary-suggestions words-suggestions hidden" role="listbox" aria-label="词库搜索联想"></div>
            </div>
          </div>
        </form>

        <div class="stats-row words-stats">
          <button type="button" class="stat-pill words-filter-pill is-active" data-filter-value="all" aria-pressed="true">
            <span class="stat-label">全部</span>
            <strong id="words-total-count">0</strong>
          </button>
          <button type="button" class="stat-pill words-filter-pill" data-filter-value="reviewable" aria-pressed="false">
            <span class="stat-label">待复习</span>
            <strong id="words-reviewable-count">0</strong>
          </button>
          <button type="button" class="stat-pill words-filter-pill" data-filter-value="mastered" aria-pressed="false">
            <span class="stat-label">熟词</span>
            <strong id="words-mastered-count">0</strong>
          </button>
        </div>

        <div class="words-sort-row" aria-label="词库排序">
          <button type="button" class="words-sort-button is-active" data-sort-key="added_at" aria-pressed="true">
            添加时间 <span class="sort-arrow" aria-hidden="true">▼</span>
          </button>
          <button type="button" class="words-sort-button" data-sort-key="term" aria-pressed="false">
            字母排序 <span class="sort-arrow" aria-hidden="true">▲▼</span>
          </button>
          <button type="button" class="words-sort-button" data-sort-key="correct_count" aria-pressed="false">
            答对次数 <span class="sort-arrow" aria-hidden="true">▲▼</span>
          </button>
        </div>

        <p id="words-sync-status" class="status-text" aria-live="polite">正在读取词库与在线进度。</p>
      </section>

      <section class="panel words-list-panel">
        <div id="words-list" class="words-list"></div>
        <p id="words-empty" class="status-text hidden" aria-live="polite">当前没有符合条件的词条。</p>
        <div id="words-load-more-row" class="words-load-more-row hidden">
          <p id="words-render-count" class="words-render-count"></p>
          <button id="words-load-more" class="secondary-button" type="button">显示更多词条</button>
        </div>
      </section>
    </main>

    <script src="./words.js?v=20260820-users" defer></script>
  </body>
</html>
